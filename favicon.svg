<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#40d6a0"/>
      <stop offset="0.5" stop-color="#17b379"/>
      <stop offset="1" stop-color="#077a52"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9faf2"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="lift" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.6" flood-color="#054a33" flood-opacity="0.34"/>
    </filter>
    <filter id="settle" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.5" flood-color="#054a33" flood-opacity="0.22"/>
    </filter>
    <clipPath id="shape"><path d="M0 32C0 8 8 0 32 0s32 8 32 32-8 32-32 32S0 56 0 32Z"/></clipPath>
  </defs>

  <g clip-path="url(#shape)">
    <rect width="64" height="64" fill="url(#bg)"/>
    <ellipse cx="32" cy="-2" rx="30" ry="13" fill="#ffffff" opacity="0.26" filter="url(#soft)"/>
    <ellipse cx="32" cy="68" rx="40" ry="19" fill="#054a33" opacity="0.38" filter="url(#soft)"/>
    <!-- glow halo lifting the composition off the surface -->
    <ellipse cx="32" cy="31" rx="26" ry="24" fill="#ffffff" opacity="0.12" filter="url(#soft)"/>

    <g transform="translate(32 32) scale(1) translate(-32 -32)">
      <!-- back slip, leaning away -->
      <path d="M19.5 26.5a3.5 3.5 0 0 1 3.5-3.5h18a3.5 3.5 0 0 1 3.5 3.5v14a3.5 3.5 0 0 1-3.5 3.5H23a3.5 3.5 0 0 1-3.5-3.5Z" transform="rotate(-12 32 32)" fill="#ffffff" opacity="0.38" filter="url(#settle)"/>
      <!-- front slip, leaning toward the light -->
      <g transform="rotate(8 32 32)" filter="url(#lift)">
        <path d="M19.5 26.5a3.5 3.5 0 0 1 3.5-3.5h18a3.5 3.5 0 0 1 3.5 3.5v14a3.5 3.5 0 0 1-3.5 3.5H23a3.5 3.5 0 0 1-3.5-3.5Z" fill="url(#paper)"/>
        <rect x="24" y="27.8" width="10.5" height="3" rx="1.5" fill="#0d8f66" opacity="0.9"/>
      </g>
    </g>
  </g>
  <path d="M0 32C0 8 8 0 32 0s32 8 32 32-8 32-32 32S0 56 0 32Z" transform="translate(0.5 0.5) scale(0.984375)" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1"/>
</svg>